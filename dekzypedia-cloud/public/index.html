<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zeptrine Cloud - Hosting Bot WhatsApp Tanpa VPS</title>
<meta name="description" content="Jalankan bot WhatsApp tanpa VPS dan tanpa coding. Tautkan nomor lewat pairing code, bot online dalam satu menit.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script>
  // pasang tema sebelum halaman tampil (hindari kedip)
  try { var t = localStorage.getItem('lc_theme'); if (t) document.documentElement.setAttribute('data-theme', t) } catch (e) {}
</script>
</head>
<body>
<div id="splash" aria-live="polite">
  <div class="splash-in">
    <img src="/icon.svg" alt="" width="64" height="64">
    <div class="splash-name" id="splashName">ZEPTRINE CLOUD</div>
    <div class="splash-bar"><i id="splashBar"></i></div>
    <div class="splash-txt">Mengunduh aset <b id="splashPct">0%</b></div>
  </div>
</div>

<header class="nav" id="nav"></header>
<main id="view" tabindex="-1"></main>
<footer id="foot"></footer>
<div id="player" class="player" hidden></div>
<div id="toasts" aria-live="polite"></div>
<audio id="audio" preload="metadata"></audio>

<script src="/js/app.js"></script>
</body>
</html>
